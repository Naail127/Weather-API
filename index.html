<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper-Local Weather</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        h1 { font-size: 1.5rem; color: #333; margin-bottom: 10px; }
        .btn { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        .btn:hover { background: #0056b3; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .metric { display: flex; justify-content: space-between; margin: 15px 0; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .metric span:first-child { color: #666; }
        .metric span:last-child { font-weight: bold; color: #333; }
        #status { margin-top: 15px; font-size: 0.9rem; color: #666; }
        .source-badge { font-size: 0.7rem; background: #eee; padding: 2px 6px; border-radius: 4px; margin-top: 10px; display: inline-block;}
    </style>
</head>
<body>

<div class="card">
    <h1>Local Forecaster</h1>
    <div id="weather-display" style="display:none;">
        <div class="metric"><span>Temp</span> <span id="temp">--°C</span></div>
        <div class="metric"><span>Wind</span> <span id="wind">-- km/h</span></div>
        <div class="metric"><span>Humid (Avg)</span> <span id="humid">--%</span></div>
        <div class="source-badge" id="source">Source: --</div>
    </div>
    <p id="status">Click below to get local weather.</p>
    <button class="btn" onclick="getLocation()" id="getBtn">Get My Weather</button>
</div>

<script>
    function getLocation() {
        const status = document.getElementById('status');
        const btn = document.getElementById('getBtn');
        
        if (!navigator.geolocation) {
            status.textContent = 'Geolocation is not supported by your browser';
            return;
        }

        status.textContent = 'Locating...';
        btn.disabled = true;

        navigator.geolocation.getCurrentPosition(success, error);
    }

    function success(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        fetchWeather(lat, lon);
    }

    function error() {
        document.getElementById('status').textContent = 'Unable to retrieve your location';
        document.getElementById('getBtn').disabled = false;
    }

    async function fetchWeather(lat, lon) {
        const status = document.getElementById('status');
        
        try {
            status.textContent = 'Fetching hyper-local data...';
            const response = await fetch(`/api/weather?lat=${lat}&lon=${lon}`);
            const data = await response.json();

            if (data.error) {
                status.textContent = data.error;
            } else {
                document.getElementById('temp').textContent = data.temperature + "°C";
                document.getElementById('wind').textContent = data.windspeed + " km/h";
                document.getElementById('humid').textContent = data.avg_humidity_12h + "%";
                document.getElementById('source').textContent = "Data Source: " + data.source;
                
                document.getElementById('weather-display').style.display = 'block';
                status.textContent = '';
            }
        } catch (e) {
            status.textContent = 'Server error.';
        } finally {
            document.getElementById('getBtn').disabled = false;
        }
    }
</script>

</body>
</html>
